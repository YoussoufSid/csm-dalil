<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دليل المؤسسات السنية في مالي</title>
<meta name="theme-color" content="#0f5132">
<meta name="description" content="منصة الإحصاء والتوثيق — تجمع أهل السنة والجماعة في مالي">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دليل CSM">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --g:#0f5132; --g2:#14704a; --g3:#e7f2ec; --gold:#b8892b; --gold2:#f6eedc;
  --ink:#1d2a24; --mut:#66756d; --line:#dfe6e2; --bg:#f7f8f6; --card:#fff; --red:#a33a2c;
}
*{box-sizing:border-box}
body{margin:0;font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
header{background:linear-gradient(270deg,rgba(11,61,38,.94) 0%,rgba(15,81,50,.82) 55%,rgba(15,81,50,.35) 100%),url("mosque.jpg") center 18%/cover no-repeat,#0f5132;color:#fff;padding:26px 16px 22px}
header .top{display:flex;align-items:center;gap:14px;max-width:1100px;margin:auto}
.logo{width:68px;height:68px;flex:none;border-radius:50%;background:#fff;object-fit:contain;padding:3px;box-shadow:0 3px 12px rgba(0,0,0,.3)}
header h1{font-family:Amiri,serif;font-size:26px;margin:0;line-height:1.3;text-shadow:0 1px 6px rgba(0,0,0,.35)}
header p{margin:2px 0 0;font-size:13px;opacity:.9}
header .fr{font-size:11.5px;letter-spacing:.5px;opacity:.75;direction:ltr;text-align:right;margin-top:3px}
.rep .rh img{width:84px;height:84px;object-fit:contain;display:block;margin:0 auto 6px}
.role:empty{display:none}
.role{margin-inline-start:auto;font-size:12px;background:rgba(255,255,255,.14);padding:4px 10px;border-radius:20px;white-space:nowrap}
nav{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
nav .in{display:flex;gap:2px;max-width:1100px;margin:auto;padding:0 8px}
nav a{white-space:nowrap;padding:12px 12px;color:var(--mut);text-decoration:none;font-weight:700;border-bottom:3px solid transparent;font-size:14.5px}
nav a.on{color:var(--g);border-color:var(--gold)}
main{max-width:1100px;margin:auto;padding:16px 16px 90px}
.banner{background:var(--gold2);border:1px solid #e6d3a8;color:#6b4f12;padding:10px 12px;border-radius:10px;margin-bottom:14px;font-size:13.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;transition:.15s}
.kpi:hover{border-color:var(--g2)}
.kpi .ic{font-size:22px}
.kpi .n{font-size:30px;font-weight:800;color:var(--g);margin-top:4px}
.kpi .l{color:var(--mut);font-weight:500}
.kpi .s{font-size:12.5px;color:var(--mut);margin-top:6px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
.sec h2{margin:0 0 12px;font-size:17px;color:var(--g)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.bar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13.5px}
.bar .lb{width:130px;flex:none;color:var(--ink)}
.bar .tr{flex:1;background:var(--g3);height:12px;border-radius:6px;overflow:hidden;display:flex}
.bar .fl{background:var(--g2);height:100%}
.bar .fl.f{background:var(--gold)}
.bar .v{width:54px;text-align:left;font-weight:700;font-variant-numeric:tabular-nums}
.legend{font-size:12.5px;color:var(--mut);display:flex;gap:14px;margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:4px;vertical-align:middle}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}
th{color:var(--mut);font-weight:700;font-size:13px;background:#fafbfa}
td.num,th.num{text-align:center;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:800;background:var(--g3)}
.tw{overflow-x:auto}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
input,select,textarea{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);width:100%}
.tools input{flex:1;min-width:180px;width:auto}
.tools select{width:auto}
button{font:inherit;font-weight:700;border:0;border-radius:9px;padding:9px 14px;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.bp{background:var(--g);color:#fff}
.bs{background:var(--g3);color:var(--g)}
.bg{background:var(--gold2);color:#7a5a17}
.bd{background:#f7e3df;color:var(--red)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.it{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;position:relative}
.it:hover{border-color:var(--g2)}
.it h3{margin:0 0 4px;font-size:16px;padding-left:24px}
.it .m{color:var(--mut);font-size:13px}
.it .st{position:absolute;left:12px;top:12px;font-size:15px}
.tag{display:inline-block;background:var(--g3);color:var(--g);font-size:12px;padding:2px 8px;border-radius:20px;margin:6px 0 0 4px;font-weight:700}
.tag.gd{background:var(--gold2);color:#7a5a17}
.tag.cat{background:#eef0ff;color:#3c4a8f}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.count{color:var(--mut);font-size:13px}
dialog{border:0;border-radius:16px;padding:0;width:min(640px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(10,30,20,.45)}
.dh{padding:14px 16px;background:var(--g);color:#fff;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:2}
.dh h3{margin:0;font-size:17px}
.dh button{background:transparent;color:#fff;font-size:20px;padding:2px 8px}
.db{padding:16px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.fg .full{grid-column:1/-1}
.fg h4{grid-column:1/-1;margin:8px 0 0;font-size:14px;color:var(--g);border-bottom:1px dashed var(--line);padding-bottom:4px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px;font-weight:500}
label b{color:var(--red)}
.hint{font-size:12px;color:var(--mut);margin-top:3px}
.chk{display:flex;flex-wrap:wrap;gap:6px}
.chk label{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:20px;padding:5px 10px;margin:0;color:var(--ink);cursor:pointer}
.chk input{width:auto}
.row{display:flex;gap:6px}
.row input{flex:1}
.row button{white-space:nowrap;padding:9px 10px}
.df{padding:12px 16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-start;position:sticky;bottom:0;background:#fff}
.det{display:grid;grid-template-columns:140px 1fr;gap:6px 10px;font-size:14.5px}
.det dt{color:var(--mut)}
.det dd{margin:0;font-weight:500}
.meta{margin-top:14px;padding-top:10px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--mut);line-height:1.8}
.pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12.5px;font-weight:700}
.pill.ok{background:var(--g3);color:var(--g)}
.pill.pd{background:var(--gold2);color:#7a5a17}
.err{color:var(--red);font-size:13px;margin-top:8px}
a.lnk{color:var(--g2);font-weight:700}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
.fab{position:fixed;bottom:18px;left:18px;width:54px;height:54px;border-radius:50%;font-size:28px;box-shadow:0 6px 18px rgba(0,0,0,.2);padding:0}
/* report */
.rep{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px}
.rep .rh{text-align:center;border-bottom:3px double var(--gold);padding-bottom:12px;margin-bottom:16px}
.rep .rh h2{font-family:Amiri,serif;font-size:26px;color:var(--g);margin:0}
.rep .rh p{margin:4px 0 0;color:var(--mut)}
.rep h3{color:var(--g);font-size:16px;margin:20px 0 8px}
.rep table{font-size:13.5px}
.rep th,.rep td{border:1px solid var(--line)}
.rep .sig{display:flex;justify-content:space-between;margin-top:40px;font-size:14px}
@media (max-width:560px){.fg{grid-template-columns:1fr}.det{grid-template-columns:110px 1fr}.bar .lb{width:100px}header h1{font-size:20px}.rep{padding:14px}}
@media print{
  header,nav,.fab,.noprint,.toast{display:none!important}
  body{background:#fff}
  main{padding:0;max-width:none}
  .rep{border:0;padding:0}
  .rep table{page-break-inside:auto}
  .rep tr{page-break-inside:avoid}
}

/* ---- standalone additions ---- */
.hbtns{margin-inline-start:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.hb{background:rgba(255,255,255,.16);color:#fff;font-size:12.5px;padding:6px 10px;border-radius:20px;font-weight:700;border:0;cursor:pointer;white-space:nowrap}
.hb:empty{display:none}
#sync{font-size:12px;padding:5px 10px;border-radius:20px;background:rgba(255,255,255,.14);white-space:nowrap}
#sync.off{background:#f6d58a;color:#5b420c}
#auth{max-width:420px;margin:30px auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px}
#auth h2{margin:0 0 4px;color:var(--g);font-size:20px}
#auth .sub{color:var(--mut);font-size:13.5px;margin-bottom:16px}
#auth .fld{margin-bottom:10px}
#auth button{width:100%;margin-top:6px}
.gbtn{background:#fff;border:1px solid var(--line)!important;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:8px}
.or{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:12.5px;margin:14px 0}
.or:before,.or:after{content:"";flex:1;border-top:1px solid var(--line)}
.lnkb{background:none;color:var(--g2);padding:4px;font-weight:700;width:auto!important}
.wait{text-align:center;padding:30px 16px}
.wait .big{font-size:46px}
.ubadge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:700;background:var(--g3);color:var(--g)}
.ubadge.pending{background:var(--gold2);color:#7a5a17}
.ubadge.admin{background:#e7e9fb;color:#3c4a8f}
@media (max-width:560px){header .top{flex-wrap:wrap}.hbtns{width:100%;justify-content:flex-start;margin-top:6px}}

/* ===== v3 layout ===== */
header,#navw{display:none!important}
#shell{display:flex;min-height:100vh}
#side{width:264px;flex:none;background:#fff;border-left:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;z-index:40}
.brand{display:flex;gap:10px;align-items:center;padding:18px 16px 16px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.brand img{width:54px;height:54px;border-radius:50%;object-fit:contain;background:#fff;border:1px solid var(--line);flex:none}
.brand b{display:block;font-family:Amiri,serif;font-size:16.5px;color:var(--g);line-height:1.35}
.brand small{color:var(--mut);font-size:12px}
.brand .bsub{display:flex;align-items:center;gap:6px;margin-top:3px;white-space:nowrap}
.brand img.flag{width:21px;height:14px;border-radius:2px;border:0;background:none;object-fit:cover;box-shadow:0 0 0 1px rgba(0,0,0,.12);flex:none}
#nav{padding:6px 0 10px}
#nav .grp{font-size:11.5px;color:var(--mut);padding:14px 24px 4px;font-weight:700}
#nav a{display:flex;align-items:center;gap:10px;padding:9px 14px;margin:2px 10px;border-radius:11px;color:var(--ink);text-decoration:none;font-weight:600;font-size:14.5px}
#nav a:hover{background:#f3f6f4}
#nav a.on{background:var(--g3);color:var(--g)}
#nav a .ic{width:22px;text-align:center}
#nav a .cnt{margin-inline-start:auto;font-size:11.5px;background:#eef2ef;color:var(--mut);border-radius:20px;padding:1px 8px;font-variant-numeric:tabular-nums}
#nav a.on .cnt{background:#fff;color:var(--g)}
#nav a .dot{margin-inline-start:auto;width:8px;height:8px;border-radius:50%;background:#d23}
.sfoot{margin-top:auto;padding:12px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.sfoot .hb{background:var(--g3);color:var(--g);border-radius:10px;padding:8px 10px;font-size:13.5px;text-align:center}
.sfoot #logout{background:#f7e3df;color:var(--red)}
#who{font-size:13px;color:var(--mut);line-height:1.6}
#who b{color:var(--ink);display:block;font-size:14px}
#col{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{position:sticky;top:0;z-index:20;background:rgba(247,248,246,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 18px;min-height:56px}
#topbar h2{margin:0;font-size:17px;color:var(--g);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .role{background:var(--g3);color:var(--g);font-size:12px;padding:4px 10px;border-radius:20px;font-weight:700}
#topbar #sync{background:var(--g3);color:var(--g)}
#topbar #sync.off{background:#f6d58a;color:#5b420c}
#menu,.tlogo{display:none}
#menu{background:var(--g3);color:var(--g);font-size:20px;padding:4px 11px;border-radius:10px}
.tlogo{width:34px;height:34px;border-radius:50%;background:#fff;object-fit:contain;border:1px solid var(--line)}
#scrim{display:none}
main{max-width:1150px;width:100%;margin:0 auto;padding:18px 18px 90px}
body.noside #side,body.noside #topbar{display:none}
@media (max-width:900px){
 #side{position:fixed;right:0;top:0;transform:translateX(105%);transition:transform .25s;box-shadow:-8px 0 30px rgba(0,0,0,.15)}
 body.open #side{transform:none}
 body.open #scrim{display:block;position:fixed;inset:0;background:rgba(10,30,20,.4);z-index:30}
 #menu,.tlogo{display:inline-flex}
 #topbar{padding:8px 12px}
 #topbar h2{font-size:15.5px}
 main{padding:14px 12px 90px}
}
/* hero */
.hero{display:grid;grid-template-columns:1.25fr 1fr;border-radius:20px;overflow:hidden;background:linear-gradient(135deg,#0f5132,#0a3a24);color:#fff;box-shadow:0 10px 30px rgba(15,81,50,.18)}
.hero .tx{padding:30px 30px 26px}
.hero .kick{font-size:12.5px;color:#f2d48a;display:flex;align-items:center;gap:6px}
.hero .kick:before{content:"";width:7px;height:7px;border-radius:50%;background:#f2d48a}
.hero .say{font-size:12.5px;opacity:.8;margin-top:16px}
.hero .verse{font-family:Amiri,serif;font-size:32px;line-height:1.7;color:#fff;margin:4px 0 2px}
.hero .ref{font-size:12px;color:#f2d48a}
.hero p.lead{margin:16px 0 0;line-height:1.9;opacity:.92;font-size:14.5px}
.hero .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.hero .gold{background:linear-gradient(180deg,#f2d48a,#d9b25c);color:#3d2c06;padding:11px 20px;border-radius:12px}
.hero .ghost{background:rgba(255,255,255,.12);color:#fff;padding:11px 18px;border-radius:12px}
.hero .img{background:url("mosque.jpg") center 30%/cover;min-height:300px}
@media (max-width:760px){.hero{grid-template-columns:1fr}.hero .img{min-height:170px;order:-1}.hero .tx{padding:20px}.hero .verse{font-size:24px}}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:16px}
.qt{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:2px}
.qt:hover{border-color:var(--g2);transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.05)}
.qt .ic{font-size:24px}
.qt .n{font-size:26px;font-weight:800;color:var(--g)}
.qt .l{font-weight:700}
.qt .s{font-size:12px;color:var(--mut)}
.sech{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px}
.sech h3{margin:0;font-size:17px;color:var(--g)}
.sech a{font-size:13.5px;color:var(--g2);font-weight:700;text-decoration:none}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.rg{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;position:relative;overflow:hidden}
.rg:hover{border-color:var(--g2)}
.rg h4{margin:0 0 6px;font-size:15.5px}
.rg .t{font-size:24px;font-weight:800;color:var(--g)}
.rg .mini{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--mut);margin-top:6px}
.rg.zero{opacity:.55}
.rg .bar0{position:absolute;bottom:0;right:0;height:4px;background:linear-gradient(90deg,var(--gold),var(--g2))}
.back{background:var(--g3);color:var(--g);padding:7px 12px;border-radius:10px;font-weight:700;text-decoration:none;font-size:13.5px}
.fav{background:var(--gold2);color:#7a5a17}
.it .favm{position:absolute;left:36px;top:12px;font-size:14px}
.authwrap{max-width:1000px;margin:20px auto;display:grid;grid-template-columns:1.1fr .9fr;gap:18px;align-items:start;padding:0 12px}
.authwrap #auth{margin:0;max-width:none}
@media (max-width:820px){.authwrap{grid-template-columns:1fr}}

/* ===== v3 extras ===== */
.langb{background:#fff;border:1px solid var(--line)!important;color:var(--g);font-size:13px;padding:6px 12px;border-radius:20px;white-space:nowrap}
.authtop{display:flex;align-items:center;gap:12px;max-width:1000px;margin:6px auto 0;padding:0 12px}
.authtop img{width:52px;height:52px;border-radius:50%;background:#fff;object-fit:contain;border:1px solid var(--line)}
.authtop b{display:block;font-family:Amiri,serif;font-size:19px;color:var(--g)}
.authtop small{color:var(--mut)}
.authtop .langb{margin-inline-start:auto}
.alinks{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:8px}
.gst{width:100%}
.hero .mean{font-size:13.5px;font-style:italic;opacity:.9;margin-top:4px}
.sbox{position:relative;flex:1;min-width:180px;display:flex}
.sbox input{flex:1}
.clr{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);background:#eef2ef;color:var(--mut);padding:2px 9px;border-radius:50%;font-size:16px}
.fg .bad input,.fg .bad select{border-color:var(--red);background:#fff7f6}
.it h3{padding-inline-end:24px;padding-left:0}
.it .st{left:auto;inset-inline-end:12px}
.it .favm{left:auto;inset-inline-end:36px}
.hero a.gold,.hero a.ghost{text-decoration:none;font-weight:700}
dialog{border-radius:18px}
.qt .ic{font-size:26px}
/* LTR */
[dir=ltr] th,[dir=ltr] td{text-align:left}
[dir=ltr] td.num,[dir=ltr] th.num{text-align:center}
[dir=ltr] .bar .v{text-align:right}
[dir=ltr] .fab{left:auto;right:18px}
[dir=ltr] #side{border-left:0;border-right:1px solid var(--line)}
[dir=ltr] .legend i{margin-left:0;margin-right:4px}
@media (max-width:900px){[dir=ltr] #side{right:auto;left:0;transform:translateX(-105%);box-shadow:8px 0 30px rgba(0,0,0,.15)} [dir=ltr] body.open #side{transform:none}}
@media (max-width:600px){#topbar .role{display:none}#topbar #langbtn2{padding:5px 9px;font-size:12px}#topbar #sync{font-size:11px;padding:3px 8px}}

/* ===== v4 ===== */
.micb{background:var(--g3);color:var(--g);padding:8px 11px;border-radius:9px;font-size:16px}
.micb.rec{background:#fde2e2;color:#c22;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
details.more{margin-top:12px;border:1px dashed var(--line);border-radius:12px;padding:8px 12px;background:#fbfcfb}
details.more summary{cursor:pointer;font-weight:700;color:var(--g);padding:4px 0;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{margin-bottom:6px}
